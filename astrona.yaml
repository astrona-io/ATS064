# Course manifest for ATS064. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone lab and a quiz. Every lab and playground was built untested.
training:
  id: ATS064
  title: 'CGOA: GitOps Terminology'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering every published objective in the CGOA GitOps Terminology domain. Labs run on kind (Kubernetes 1.35)
    with a local Git repository as the state store.
  certification:
    name: Certified GitOps Associate
    code: CGOA
    provider: CNCF / Linux Foundation
    domain: GitOps Terminology
    weight: 20
    competencies:
    - Continuous
    - Declarative Description
    - Desired State
    - State Drift
    - State Reconciliation
    - GitOps Managed Software System
    - State Store
    - Feedback Loop
    - Rollback
modules:
  - id: module-intro
    title: Introduction
    description: Audience, learning approach, reading requirements and contribution process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
  - id: module-010
    title: "Continuous"
    description: >
      Makes the reader able to explain continuous operation: the difference between a one-time job and a repeating agent, polling and events, missed events, and convergence time, with a reconciliation loop built against a Git repository.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md

      - type: reading
        title: "Continuous Operation And Missed Events"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "One-Time Delivery Versus A Continuous Agent"
        path: sections/section-010/module-01/course-01-one-time-delivery-versus-a-continuous-agent.md
      - type: reading
        title: "Intervals, Events And Missed Events"
        path: sections/section-010/module-01/course-02-intervals-events-and-missed-events.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Build A Reconciliation Loop Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: gitops
        task_kind: build
        tags: [continuous, reconciliation, git, kubectl-apply, polling]
        learning_goals:
          - Write a script that compares and applies a Git repository in a loop
          - Make the loop configurable with an interval and a one-pass mode
          - Commit the script and make the cluster match the latest commit
        resources:
          - name: "OpenGitOps principles"
            url: https://opengitops.dev/
          - name: "kubectl apply"
            url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_apply/
      - type: reading
        title: "Summary"
        path: sections/section-010/module-01/course-03-summary.md

      - type: reading
        title: "Question"
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Continuous Operation Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: gitops
        task_kind: build
        tags: [continuous, reconciliation, failure-handling, interval, git]
        learning_goals:
          - Fix an invalid manifest in a new commit without rewriting history
          - Build a loop that reports a failed apply and keeps applying valid manifests
          - Make three Deployments match the latest commit
        resources:
          - name: "OpenGitOps principles"
            url: https://opengitops.dev/
          - name: "kubectl diff"
            url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_diff/
      - type: quiz
        title: "Knowledge Check: Continuous"
        path: sections/section-010/quiz.yaml
        pass_score: 70
