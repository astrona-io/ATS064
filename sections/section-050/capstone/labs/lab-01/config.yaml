# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Reconciliation (CAPSTONE). Graded against the live cluster and the Git repository. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-064-capstone-050
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-gitops-lab
      description: Create the Git repository and apply its starting revision
      type: file
      source: bootstrap/01-seed.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the Deployments have rolled out
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: shuttle-converged
      description: "shuttle runs the image 6.15.0 with every replica updated and available"
      type: file
      source: validation/validate-shuttle-converged.sh
      hint: "The tag 6.15.O has a letter O. Fix it in Git and apply."
    - name: quota-fixed
      description: "The quota in outpost allows at least 3 pods in Git and live, and drifter has 3 available replicas"
      type: file
      source: validation/validate-quota-fixed.sh
      hint: "Three replicas do not fit in a quota of 2 pods. Edit the quota manifest in Git and apply it."
    - name: manifests-valid
      description: "Every manifest in apps is valid and the ConfigMap outpost-notes exists with retries \"3\""
      type: file
      source: validation/validate-manifests-valid.sh
      hint: "A number is not a string. Quote the value in the ConfigMap, then apply."
    - name: idempotent
      description: "A second kubectl apply of the whole repository reports every object as unchanged"
      type: file
      source: validation/validate-idempotent.sh
      hint: "Apply the repository until nothing is configured any more."
    - name: committed-on-history
      description: "The fixes are committed on top of the seed with a clean working tree"
      type: file
      source: validation/validate-committed-on-history.sh
      hint: "Make new commits. Do not rewrite existing ones."
    - name: workloads-running
      description: "scout, probe and shuttle are available"
      type: file
      source: validation/validate-workloads-running.sh
      hint: "Do not delete a Deployment or scale it to zero."

teardown:
  keepCluster: false
