# Final domain knowledge check across all nine sections. Listed in astrona.yaml as a `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats064-final
course_id: ATS064
exam_code: CGOA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: gitops-terminology
  title: GitOps Terminology
questions:
- id: ats064-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name what makes a GitOps agent continuous
  source_readings:
  - sections/section-010/module-01/course-01-one-time-delivery-versus-a-continuous-agent.md
  prompt: Which statement describes what the word continuous means in GitOps?
  options:
  - id: a
    text: Every change reaches the cluster in less than one second.
    explanation: Continuous does not mean instant. Fetching, applying and the cluster's
      own work take time.
  - id: b
    text: The pipeline runs on every commit.
    explanation: That is event-triggered delivery. It runs only when a commit happens.
  - id: c
    text: The agent returns to the same observe, compare and act work again and again
      without a new trigger from a person.
    explanation: Correct. The repeated return to the comparison is the defining behavior.
  - id: d
    text: The Git repository is hosted on a server that is always online.
    explanation: Availability of the server is not what makes an agent continuous.
  correct_option: c
  explanation: Correct. The repeated return to the comparison is the defining behavior.
- id: ats064-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Select a sound failure policy for repeated passes
  source_readings:
  - sections/section-010/module-01/course-02-intervals-events-and-missed-events.md
  prompt: The Git server becomes unreachable and every pass of an agent fails. What
    should a well-designed agent do?
  options:
  - id: a
    text: Exit, so that a person must restart it.
    explanation: The agent should recover without a person.
  - id: b
    text: Record the failure, keep the loop alive and retry on later passes with a
      growing delay.
    explanation: Correct. The agent recovers when the source returns, and a growing
      delay avoids adding load on a struggling dependency.
  - id: c
    text: Retry as fast as possible until the server answers.
    explanation: A tight retry loop adds load exactly when the server is struggling.
  - id: d
    text: Delete the managed workloads, because the desired state is unknown.
    explanation: The cluster keeps running the last applied revision. Deleting it
      would cause an outage.
  correct_option: b
  explanation: Correct. The agent recovers when the source returns, and a growing
    delay avoids adding load on a struggling dependency.
- id: ats064-final-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Explain idempotence of kubectl apply
  source_readings:
  - sections/section-020/module-01/course-01-declarative-versus-imperative-descriptions.md
  prompt: An agent runs kubectl apply -f deployment.yaml on every pass. The cluster
    already matches the file. What does the command do?
  options:
  - id: a
    text: It deletes the Deployment and creates it again.
    explanation: apply does not recreate an object that matches.
  - id: b
    text: It fails because the object already exists.
    explanation: That is the behavior of kubectl create.
  - id: c
    text: It compares the manifest with the live object, finds no difference and changes
      nothing.
    explanation: Correct. Applying a manifest again leaves the same result.
  - id: d
    text: It scales the Deployment by one replica.
    explanation: apply does not change any field that the manifest states with the
      same value.
  correct_option: c
  explanation: Correct. Applying a manifest again leaves the same result.
- id: ats064-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Find hidden defaults
  source_readings:
  - sections/section-020/module-01/course-02-scope-references-defaults-and-dependencies.md
  prompt: A Deployment manifest uses the image ghcr.io/stefanprodan/podinfo without
    a tag. What is the problem?
  options:
  - id: a
    text: The API server rejects an image without a tag.
    explanation: The API server accepts it and uses latest.
  - id: b
    text: The tag defaults to latest, so the running image can change although the
      manifest did not change.
    explanation: Correct. A default hides a decision outside the file.
  - id: c
    text: The pod always runs the oldest image of the repository.
    explanation: The default is the tag latest, not the oldest.
  - id: d
    text: There is no problem, because the registry stores one image per name.
    explanation: A registry stores many tags, and latest moves.
  correct_option: b
  explanation: Correct. A default hides a decision outside the file.
- id: ats064-final-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Recognize system-generated fields
  source_readings:
  - sections/section-030/module-01/course-01-what-belongs-in-the-desired-state.md
  prompt: Which field of a Service is generated by the cluster and does not belong
    in Git?
  options:
  - id: a
    text: spec.selector
    explanation: People decide the selector.
  - id: b
    text: metadata.name
    explanation: People decide the name.
  - id: c
    text: spec.clusterIP
    explanation: Correct. It is an address that the cluster allocated from its own
      range.
  - id: d
    text: spec.ports[0].port
    explanation: People decide the port.
  correct_option: c
  explanation: Correct. It is an address that the cluster allocated from its own range.
- id: ats064-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Name a limit of immutability
  source_readings:
  - sections/section-030/module-01/course-02-versioned-immutable-and-complete.md
  prompt: Commits are immutable, but a team lead worries that history can still be
    rewritten. What is the accurate description?
  options:
  - id: a
    text: Commits can be edited in place when you have the repository password.
    explanation: A changed commit would have a different hash and would be a different
      commit.
  - id: b
    text: A forced push can make a branch point at different commits, so a protection
      rule on the server is needed to keep branches from being rewritten.
    explanation: Correct. The commits stay unchanged, but the branch name can move.
  - id: c
    text: History can never be rewritten in any way.
    explanation: A branch can be moved to different commits.
  - id: d
    text: Only tags can be rewritten.
    explanation: Tags can also be moved, and branches are the usual case.
  correct_option: b
  explanation: Correct. The commits stay unchanged, but the branch name can move.
- id: ats064-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Name a source of drift
  source_readings:
  - sections/section-040/module-01/course-01-what-drift-is-and-how-to-detect-it.md
  prompt: Which action is a common source of drift?
  options:
  - id: a
    text: A commit that changes replicas in the manifest.
    explanation: That changes the desired state, so it is not drift.
  - id: b
    text: A merge request that is still open.
    explanation: An open request changes nothing in the cluster.
  - id: c
    text: An engineer runs kubectl scale on a Deployment that Git manages.
    explanation: Correct. The live value changes and Git does not.
  - id: d
    text: A new tag on an existing commit.
    explanation: A tag does not change any object.
  correct_option: c
  explanation: Correct. The live value changes and Git does not.
- id: ats064-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose between revert and adopt
  source_readings:
  - sections/section-040/module-01/course-02-reverting-adopting-and-field-ownership.md
  prompt: During an incident an engineer scaled a Deployment to five replicas, and
    the team agrees that five is the right number. What closes the drift correctly?
  options:
  - id: a
    text: Apply the old manifest to put two replicas back.
    explanation: That reverts a decision the team agreed on.
  - id: b
    text: 'Commit replicas: 5 to the manifest, so that Git states the decision.'
    explanation: Correct. Adopting changes Git so that it matches the deliberate change.
  - id: c
    text: Delete the Deployment and let the agent create it.
    explanation: It would create two replicas again and cause an outage.
  - id: d
    text: Ignore the difference forever.
    explanation: The next reconciliation would revert it.
  correct_option: b
  explanation: Correct. Adopting changes Git so that it matches the deliberate change.
- id: ats064-final-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Define convergence
  source_readings:
  - sections/section-050/module-01/course-01-the-reconciliation-loop.md
  prompt: When has a system converged?
  options:
  - id: a
    text: When kubectl apply prints configured.
    explanation: That means the API server accepted the object.
  - id: b
    text: When the commit is merged.
    explanation: A merge changes the desired state only.
  - id: c
    text: When the actual state equals the desired state, so another pass has nothing
      to do.
    explanation: Correct. Convergence is a property of the actual state.
  - id: d
    text: When the controller has run once.
    explanation: One pass may not be enough.
  correct_option: c
  explanation: Correct. Convergence is a property of the actual state.
- id: ats064-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read an image pull failure
  source_readings:
  - sections/section-050/module-01/course-02-when-reconciliation-fails.md
  prompt: The new pod of a Deployment shows ImagePullBackOff, and the old pods still
    run. What is the most likely cause?
  options:
  - id: a
    text: The ResourceQuota is exhausted.
    explanation: A quota failure creates no pod, so there is no pod status.
  - id: b
    text: The image name or tag in the manifest does not exist or cannot be pulled,
      and the rolling update kept the old pods running.
    explanation: Correct. The rollout is stuck and the service stays up.
  - id: c
    text: The manifest was rejected by the API server.
    explanation: The pod exists, so the object was accepted.
  - id: d
    text: The Deployment has too few replicas.
    explanation: The replica count does not cause a pull failure.
  correct_option: b
  explanation: Correct. The rollout is stuck and the service stays up.
- id: ats064-final-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Define the managed system
  source_readings:
  - sections/section-060/module-01/course-01-what-the-managed-system-is.md
  prompt: What is the managed system?
  options:
  - id: a
    text: The Git repository that holds the desired state.
    explanation: That is the state store.
  - id: b
    text: The program that reads the repository.
    explanation: That is the agent.
  - id: c
    text: The objects and workloads that the agent is responsible for changing.
    explanation: Correct. Its scope is the exact set of objects that the agent owns.
  - id: d
    text: The developer laptops that push commits.
    explanation: They are not part of the managed system.
  correct_option: c
  explanation: Correct. Its scope is the exact set of objects that the agent owns.
- id: ats064-final-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe Role and RoleBinding
  source_readings:
  - sections/section-060/module-01/course-02-agent-identity-and-least-privilege.md
  prompt: What does a RoleBinding do?
  options:
  - id: a
    text: It defines the rules of the Role.
    explanation: The Role defines the rules.
  - id: b
    text: It attaches a Role to subjects such as a ServiceAccount, with the permissions
      applying in the namespace of the Role.
    explanation: Correct. The rules are in the Role and the grant is in the binding.
  - id: c
    text: It gives the subject access to the whole cluster.
    explanation: That is what a ClusterRoleBinding does.
  - id: d
    text: It creates the ServiceAccount.
    explanation: A binding does not create subjects.
  correct_option: b
  explanation: Correct. The rules are in the Role and the grant is in the binding.
- id: ats064-final-q13
  type: single_choice
  difficulty: beginner
  learning_objective: What a SHA is
  source_readings:
  - sections/section-070/module-01/course-01-the-state-store-and-its-history.md
  prompt: What makes a Git history tamper-evident?
  options:
  - id: a
    text: Commits are stored in an encrypted file.
    explanation: Git does not encrypt history by default.
  - id: b
    text: Each commit has a counter.
    explanation: Counters are not part of the identifier.
  - id: c
    text: Each commit identifier is a hash that includes its parent identifier.
    explanation: Correct. Changing an old commit changes all later identifiers.
  - id: d
    text: The server rejects every push.
    explanation: A server accepts normal pushes.
  correct_option: c
  explanation: Correct. Changing an old commit changes all later identifiers.
- id: ats064-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Annotated tags
  source_readings:
  - sections/section-070/module-01/course-02-finding-and-marking-a-revision.md
  prompt: A script needs the commit that the annotated tag release-1 names. Which
    expression gives it?
  options:
  - id: a
    text: git rev-parse release-1
    explanation: This prints the SHA of the tag object.
  - id: b
    text: git rev-parse release-1^{commit}
    explanation: Correct. It follows the tag object to the commit.
  - id: c
    text: git log -1 --format=%h release-1~5
    explanation: This names a different commit.
  - id: d
    text: git cat-file -t release-1
    explanation: This prints the object type.
  correct_option: b
  explanation: Correct. It follows the tag object to the commit.
- id: ats064-final-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Sync and health status
  source_readings:
  - sections/section-080/module-01/course-01-the-feedback-loop.md
  prompt: What does the sync status of an agent report?
  options:
  - id: a
    text: Whether the application passes its tests.
    explanation: That is not what sync reports.
  - id: b
    text: The CPU use of the nodes.
    explanation: That is a metric.
  - id: c
    text: Whether the cluster matches the repository.
    explanation: Correct. The health status reports whether the workloads work.
  - id: d
    text: The number of commits.
    explanation: That is a repository fact.
  correct_option: c
  explanation: Correct. The health status reports whether the workloads work.
- id: ats064-final-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Turn status into a decision
  source_readings:
  - sections/section-080/module-01/course-01-the-feedback-loop.md
  prompt: Which command blocks until a rollout completes and exits non-zero when the
    progress deadline is exceeded?
  options:
  - id: a
    text: kubectl get deployment <name>
    explanation: It prints once and returns.
  - id: b
    text: kubectl rollout status deployment/<name>
    explanation: Correct. Use a timeout in scripts.
  - id: c
    text: kubectl scale deployment <name>
    explanation: It changes replicas.
  - id: d
    text: git status
    explanation: It reads the repository, not the cluster.
  correct_option: b
  explanation: Correct. Use a timeout in scripts.
- id: ats064-final-q17
  type: single_choice
  difficulty: beginner
  learning_objective: Rollout undo conflict
  source_readings:
  - sections/section-090/module-01/course-01-why-rollback-is-a-commit.md
  prompt: Why is kubectl rollout undo not enough in a GitOps setup?
  options:
  - id: a
    text: It deletes the Deployment.
    explanation: It does not delete.
  - id: b
    text: It cannot run on a Deployment.
    explanation: It works on Deployments.
  - id: c
    text: The repository still holds the bad change, so the next sync applies it again.
    explanation: Correct. It must be followed by a commit.
  - id: d
    text: It changes the Git history.
    explanation: It does not touch Git.
  correct_option: c
  explanation: Correct. It must be followed by a commit.
- id: ats064-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Keep good commits
  source_readings:
  - sections/section-090/module-01/course-02-reverting-safely.md
  prompt: Two bad commits have a good commit between them. What is the best way to
    roll back?
  options:
  - id: a
    text: Reset to the commit before the first bad one.
    explanation: It discards the good commit and rewrites history.
  - id: b
    text: Revert only the two bad commits and keep the good one.
    explanation: Correct. Reverting back to the last good point would discard the
      good change.
  - id: c
    text: Delete the good commit.
    explanation: History must not be rewritten.
  - id: d
    text: Revert all four commits.
    explanation: It undoes the good commit and the first one.
  correct_option: b
  explanation: Correct. Reverting back to the last good point would discard the good
    change.
