# Knowledge check for section-030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats064-030
course_id: ATS064
exam_code: CGOA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Desired State"
questions:
  - id: ats064-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define the desired state"
    source_readings:
      - sections/section-030/module-01/course-01-what-belongs-in-the-desired-state.md
    prompt: "What is the desired state in GitOps?"
    options:
      - id: a
        text: "The objects and values that the cluster reports right now."
        explanation: "That is the observed state."
      - id: b
        text: "The objects and field values that people declare as correct, held in the state store."
        explanation: "Correct. It is the input to the system."
      - id: c
        text: "The list of commands that the agent runs."
        explanation: "The desired state is a description, not a list of commands."
      - id: d
        text: "The set of container images in a registry."
        explanation: "A registry holds images, not the desired state of a cluster."
    correct_option: b
    explanation: "Correct. It is the input to the system."

  - id: ats064-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Recognize system-generated fields"
    source_readings:
      - sections/section-030/module-01/course-01-what-belongs-in-the-desired-state.md
    prompt: "Which field of a Service is generated by the cluster and does not belong in Git?"
    options:
      - id: a
        text: "spec.selector"
        explanation: "People decide the selector."
      - id: b
        text: "metadata.name"
        explanation: "People decide the name."
      - id: c
        text: "spec.clusterIP"
        explanation: "Correct. It is an address that the cluster allocated from its own range."
      - id: d
        text: "spec.ports[0].port"
        explanation: "People decide the port."
    correct_option: c
    explanation: "Correct. It is an address that the cluster allocated from its own range."

  - id: ats064-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the problem with committing a raw export"
    source_readings:
      - sections/section-030/module-01/course-01-what-belongs-in-the-desired-state.md
    prompt: "An engineer commits the output of kubectl get -o yaml for a Deployment and applies it later to a new cluster. Why is this a problem?"
    options:
      - id: a
        text: "The file carries identity and version fields, such as uid and resourceVersion, that belong to the old object and can conflict with or misstate the new one."
        explanation: "Correct. Those fields describe one object in one cluster, not the goal."
      - id: b
        text: "kubectl get cannot print YAML."
        explanation: "It prints YAML."
      - id: c
        text: "The spec is always removed from an export."
        explanation: "The spec is part of the export."
      - id: d
        text: "An export is always encrypted."
        explanation: "An export is plain text."
    correct_option: a
    explanation: "Correct. Those fields describe one object in one cluster, not the goal."

  - id: ats064-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain resourceVersion"
    source_readings:
      - sections/section-030/module-01/course-01-what-belongs-in-the-desired-state.md
    prompt: "Why does a resourceVersion in a committed manifest cause trouble?"
    options:
      - id: a
        text: "It selects the Kubernetes version of the cluster."
        explanation: "It does not name a Kubernetes release."
      - id: b
        text: "It is the version of the container image."
        explanation: "The image tag holds that."
      - id: c
        text: "It makes the manifest immutable."
        explanation: "It has no such effect."
      - id: d
        text: "It is a counter for conflict detection, so a stored value is soon old and the API server rejects the update as a conflict."
        explanation: "Correct. The API server accepts the update only if the version equals the stored one."
    correct_option: d
    explanation: "Correct. The API server accepts the update only if the version equals the stored one."

  - id: ats064-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define versioned and immutable"
    source_readings:
      - sections/section-030/module-01/course-02-versioned-immutable-and-complete.md
    prompt: "Why can an agent say that the cluster runs the commit with hash abc123 and mean something fixed?"
    options:
      - id: a
        text: "Because the hash is a branch name that always points to the newest commit."
        explanation: "A branch name moves. A hash does not."
      - id: b
        text: "Because Git blocks all pushes after a commit is made."
        explanation: "Git allows new commits."
      - id: c
        text: "A commit hash is computed from the content and the parent, so the same hash is always the same content."
        explanation: "Correct. A hash is a fixed reference."
      - id: d
        text: "Because the hash is chosen by the author."
        explanation: "The hash is computed from the content."
    correct_option: c
    explanation: "Correct. A hash is a fixed reference."

  - id: ats064-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name a limit of immutability"
    source_readings:
      - sections/section-030/module-01/course-02-versioned-immutable-and-complete.md
    prompt: "Commits are immutable, but a team lead worries that history can still be rewritten. What is the accurate description?"
    options:
      - id: a
        text: "Commits can be edited in place when you have the repository password."
        explanation: "A changed commit would have a different hash and would be a different commit."
      - id: b
        text: "A forced push can make a branch point at different commits, so a protection rule on the server is needed to keep branches from being rewritten."
        explanation: "Correct. The commits stay unchanged, but the branch name can move."
      - id: c
        text: "History can never be rewritten in any way."
        explanation: "A branch can be moved to different commits."
      - id: d
        text: "Only tags can be rewritten."
        explanation: "Tags can also be moved, and branches are the usual case."
    correct_option: b
    explanation: "Correct. The commits stay unchanged, but the branch name can move."

  - id: ats064-030-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Find hidden state"
    source_readings:
      - sections/section-030/module-01/course-02-versioned-immutable-and-complete.md
    prompt: "The list of objects in a namespace has configmap/scout-settings and configmap/kube-root-ca.crt. Neither is in the repository. What should the team do?"
    options:
      - id: a
        text: "Add both to Git."
        explanation: "The cluster makes kube-root-ca.crt in every namespace."
      - id: b
        text: "Add neither to Git because ConfigMaps are never desired state."
        explanation: "A ConfigMap that people made is part of the description."
      - id: c
        text: "Delete scout-settings from the cluster."
        explanation: "Deleting it changes behavior without any decision."
      - id: d
        text: "Add scout-settings to Git because someone made it by hand, and leave kube-root-ca.crt out because the system creates it."
        explanation: "Correct. Only objects that people made are part of the desired state."
    correct_option: d
    explanation: "Correct. Only objects that people made are part of the desired state."

  - id: ats064-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Handle secrets in a state store"
    source_readings:
      - sections/section-030/module-01/course-02-versioned-immutable-and-complete.md
    prompt: "A team puts a Secret manifest with a base64 encoded password in Git and later deletes the file in a new commit. What is the problem?"
    options:
      - id: a
        text: "Base64 is not encryption, and the value stays readable in the older commits because history is immutable."
        explanation: "Correct. Store an encrypted form or a reference instead."
      - id: b
        text: "Nothing: deleting the file removes the value from history."
        explanation: "Old commits keep the file."
      - id: c
        text: "Git encrypts Secret objects automatically."
        explanation: "Git does not encrypt content."
      - id: d
        text: "Secret objects cannot be applied from files."
        explanation: "They can be applied."
    correct_option: a
    explanation: "Correct. Store an encrypted form or a reference instead."

