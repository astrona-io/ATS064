# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Read A Failed Delivery And Fix It (LAB). Graded against the live cluster and the Git repository. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-064-lab-080-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-gitops-lab
      description: Create the Git repository and apply its starting revision
      type: file
      source: bootstrap/01-seed.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the Deployments have rolled out
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: feedback-recorded
      description: "feedback.txt names the Progressing reason that the failing Deployment reported, and is committed"
      type: file
      source: validation/validate-feedback-recorded.sh
      hint: "Read the Progressing condition of shuttle before you fix it, write its reason into feedback.txt and commit the file."
    - name: fixed-in-git
      description: "The shuttle manifest at HEAD no longer uses the missing readiness path, and the fix is committed on top of the seed"
      type: file
      source: validation/validate-fixed-in-git.sh
      hint: "Edit apps/deployment-shuttle.yaml, then commit."
    - name: shuttle-converged
      description: "shuttle is converged: observedGeneration equals generation, every replica is updated and available, and Progressing is True"
      type: file
      source: validation/validate-shuttle-converged.sh
      hint: "Apply the fixed manifest and wait with kubectl rollout status."
    - name: matches-git
      description: "kubectl diff on apps shows no difference"
      type: file
      source: validation/validate-matches-git.sh
      hint: "Run kubectl diff -R -f apps and apply what it lists."
    - name: workloads-running
      description: "scout and probe are available"
      type: file
      source: validation/validate-workloads-running.sh
      hint: "Do not delete a Deployment."

teardown:
  keepCluster: false
